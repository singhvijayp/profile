name: update profile stats

on:
  schedule:
    - cron: "17 6 * * *"   # once a day
  workflow_dispatch:        # allow manual "Run workflow" too
  push:
    branches: [main]
    paths:
      - "scripts/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stat graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_LOGIN: ${{ github.repository_owner }}
        run: python3 scripts/generate_stats.py

      - name: Generate heading graphics
        run: python3 scripts/generate_headings.py

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -- '*.svg'
          git diff --cached --quiet || git commit -m "chore: update stats"
          git push
